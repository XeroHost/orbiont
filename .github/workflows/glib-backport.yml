name: GLib backport regression

on:
  workflow_call:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  glib-optimized:
    runs-on: ubuntu-22.04
    env:
      CARGO_INCREMENTAL: '0'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          rustflags: ''
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Verify backport guard tests
        run: node --test scripts/glib-backport-integrity.test.mjs
      - name: Install GLib development libraries
        run: sudo apt-get update && sudo apt-get install -y libglib2.0-dev
      - name: Run all affected iterator methods with optimizations
        run: cargo test --locked --release --manifest-path patches/glib-regression/Cargo.toml
