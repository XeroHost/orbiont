name: Orbiont build
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - 'patches/**'
      - '.cargo/**'
      - .github/workflows/theseus-build.yml
      - .github/workflows/turbo-ci.yml
      - Cargo.toml
      - Cargo.lock
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.jsonc
      - .nvmrc
      - rust-toolchain.toml
      - 'scripts/**'
      - 'apps/app/**'
      - 'apps/app-frontend/**'
      - 'packages/**'
  workflow_dispatch:
    inputs:
      app-version-override:
        description: Temporary app version override for updater testing
        type: string
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  source:
    name: Resolve build source
    runs-on: ubuntu-latest
    outputs:
      required: ${{ steps.source.outputs.required }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
      - id: source
        shell: bash
        run: |
          # A tag run owns packaging when main already points to a release tag.
          required=true
          if [ "$GITHUB_REF" = refs/heads/main ] && git tag --points-at "$GITHUB_SHA" | grep -q '^v'; then
            required=false
          fi
          echo "required=$required" >> "$GITHUB_OUTPUT"

  validation:
    name: Validate release source
    needs: source
    if: needs.source.outputs.required == 'true'
    uses: ./.github/workflows/turbo-ci.yml

  build:
    name: Build
    needs: source
    if: needs.source.outputs.required == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            artifact-target-name: universal-apple-darwin
          - platform: windows-latest
            artifact-target-name: x86_64-pc-windows-msvc
          - platform: ubuntu-22.04
            artifact-target-name: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}

    env:
      # Tagged builds are releases: they are built with the updater enabled and
      # signed with Orbiont's updater key. Everything else is a dev build.
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.app-version-override != '' }}

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          rustflags: ''
          cache: false
          target: ${{ contains(matrix.artifact-target-name, 'darwin') && 'x86_64-apple-darwin' || '' }}

      - name: Setup compiler cache
        uses: mozilla-actions/sccache-action@d651010b8da762cde178750d8eda7b5febfe147a # v0.0.9
        with:
          version: v0.10.0
      # PR compiler-cache writes use their own namespace in addition to GHA merge-ref scope.
      # Trusted main/dispatch/tag runs never read a PR namespace.
      - name: Configure compiler cache scope
        shell: bash
        run: |
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=on" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_VERSION=orbiont-v1-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'trusted' }}-${{ runner.os }}-${{ runner.arch }}-${{ matrix.artifact-target-name || 'native-checks' }}-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}" >> "$GITHUB_ENV"
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Generate tauri-dev.conf.json
        shell: bash
        run: |
          GIT_HASH=$(git rev-parse --short HEAD)
          cat > apps/app/tauri-dev.conf.json <<EOF
          {
            "productName": "Orbiont (dev-${GIT_HASH})",
            "mainBinaryName": "Orbiont (dev-${GIT_HASH})",
            "identifier": "Orbiont-dev-${GIT_HASH}",
            "bundle": {
              "fileAssociations": []
            }
          }
          EOF

      - name: Install Linux build dependencies
        if: contains(matrix.artifact-target-name, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Dasel
        uses: jaxxstorm/action-install-gh-release@25e24d2d23ae098373794ef1d6faecb48ee52da8 # v3.0.0
        with:
          repo: TomWright/dasel
          tag: v2.8.1
          extension-matching: disable
          rename-to: ${{ contains(matrix.artifact-target-name, 'windows') && 'dasel.exe' || 'dasel' }}
          chmod: 0755

      - name: Set application version
        shell: bash
        run: |
          APP_VERSION="${{ inputs.app-version-override }}"
          if [ -z "$APP_VERSION" ] && [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = 'true' ]; then
            APP_VERSION="${GITHUB_REF_NAME}"
          fi
          if [ -n "$APP_VERSION" ]; then
            echo "Setting application version to $APP_VERSION"
            dasel put -f apps/app/Cargo.toml -t string -v "${APP_VERSION#v}" 'package.version'
            dasel put -f packages/app-lib/Cargo.toml -t string -v "${APP_VERSION#v}" 'package.version'
            dasel put -f apps/app-frontend/package.json -t string -v "${APP_VERSION#v}" 'version'
          fi

      - name: Set app environment
        shell: bash
        env:
          MICROSOFT_CLIENT_ID: ${{ vars.MICROSOFT_CLIENT_ID }}
          DISCORD_CLIENT_ID: ${{ vars.DISCORD_CLIENT_ID }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const microsoftId = (process.env.MICROSOFT_CLIENT_ID || '').trim();
          const discordId = (process.env.DISCORD_CLIENT_ID || '').trim();
          if (microsoftId && !/^[0-9a-f]{8}-(?:[0-9a-f]{4}-){3}[0-9a-f]{12}$/i.test(microsoftId)) {
            throw new Error('Repository variable MICROSOFT_CLIENT_ID must be a valid public client ID.');
          }
          if (process.env.IS_RELEASE === 'true' && !microsoftId) {
            throw new Error('Set repository variable MICROSOFT_CLIENT_ID before building a release.');
          }
          if (discordId && !/^\d+$/.test(discordId)) {
            throw new Error('Repository variable DISCORD_CLIENT_ID must be a numeric application ID.');
          }
          const content = readFileSync('packages/app-lib/.env.example', 'utf8')
            .replace(/^MICROSOFT_CLIENT_ID=.*$/m, `MICROSOFT_CLIENT_ID=${microsoftId}`)
            .replace(/^DISCORD_CLIENT_ID=.*$/m, `DISCORD_CLIENT_ID=${discordId}`);
          writeFileSync('packages/app-lib/.env', content);
          NODE

      - name: Locate pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Restore pnpm store
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Save trusted pnpm store
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Build macOS app
        if: contains(matrix.artifact-target-name, 'darwin')
        run: |
          # Tauri distinguishes missing Apple credentials from empty values.
          for credential in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_TEAM_ID APPLE_PASSWORD; do
            if [ -z "${!credential}" ]; then
              unset "$credential"
            fi
          done
          pnpm --filter=@orbiont/app run tauri build --target universal-apple-darwin --config ${{ env.IS_RELEASE == 'true' && 'tauri-release.conf.json' || 'tauri-dev.conf.json' }}
        env:
          TAURI_BUNDLER_DMG_IGNORE_CI: 'true'
          # Optional Apple signing; unsigned builds when the secrets are missing.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Build Linux app
        if: contains(matrix.artifact-target-name, 'linux')
        run: pnpm --filter=@orbiont/app run tauri build --config ${{ env.IS_RELEASE == 'true' && 'tauri-release.conf.json' || 'tauri-dev.conf.json' }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Build Windows app
        if: contains(matrix.artifact-target-name, 'windows')
        shell: pwsh
        run: |
          $env:JAVA_HOME = "$env:JAVA_HOME_17_X64"
          $config = if ($env:IS_RELEASE -eq 'true') { 'tauri-release.conf.json' } else { 'tauri-dev.conf.json' }
          pnpm --filter=@orbiont/app run tauri build --config $config --verbose --bundles nsis
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Compiler cache statistics
        if: always()
        run: sccache --show-stats

      - name: Upload app bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: App bundle (${{ matrix.artifact-target-name }})
          if-no-files-found: error
          path: |
            target/release/bundle/appimage/Orbiont*.AppImage*
            target/release/bundle/deb/Orbiont*.deb*
            target/release/bundle/rpm/Orbiont*.rpm*
            target/universal-apple-darwin/release/bundle/macos/Orbiont*.app.tar.gz*
            target/universal-apple-darwin/release/bundle/dmg/Orbiont*.dmg*
            target/release/bundle/nsis/Orbiont*-setup.exe*
            target/release/bundle/nsis/Orbiont*-setup.nsis.zip*

  release-gate:
    name: All release checks succeeded
    if: always() && needs.source.outputs.required == 'true'
    needs: [source, validation, build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Require validation and every installer
        env:
          VALIDATION_RESULT: ${{ needs.validation.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          SOURCE_SHA: ${{ github.sha }}
          SOURCE_REF: ${{ github.ref }}
        run: node scripts/ci-release-gate.mjs
      - name: Upload immutable validation evidence
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: Release gate
          path: release-gate.json
          if-no-files-found: error
