name: Orbiont build
on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths:
      - .github/workflows/theseus-build.yml
      - .github/workflows/turbo-ci.yml
      - Cargo.toml
      - Cargo.lock
      - package.json
      - pnpm-lock.yaml
      - pnpm-workspace.yaml
      - turbo.jsonc
      - .nvmrc
      - rust-toolchain.toml
      - 'scripts/**'
      - 'apps/app/**'
      - 'apps/app-frontend/**'
      - 'packages/**'
  workflow_dispatch:
    inputs:
      app-version-override:
        description: Temporary app version override for updater testing
        type: string
        required: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  validation:
    name: Validate release source
    uses: ./.github/workflows/turbo-ci.yml

  build:
    name: Build
    needs: validation
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            artifact-target-name: universal-apple-darwin
          - platform: windows-latest
            artifact-target-name: x86_64-pc-windows-msvc
          - platform: ubuntu-22.04
            artifact-target-name: x86_64-unknown-linux-gnu

    runs-on: ${{ matrix.platform }}

    env:
      # Tagged builds are releases: they are built with the updater enabled and
      # signed with Orbiont's updater key. Everything else is a dev build.
      IS_RELEASE: ${{ startsWith(github.ref, 'refs/tags/v') || inputs.app-version-override != '' }}

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          rustflags: ''
          target: ${{ contains(matrix.artifact-target-name, 'darwin') && 'x86_64-apple-darwin' || '' }}
          cache-workspaces: '. -> target'

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Generate tauri-dev.conf.json
        shell: bash
        run: |
          GIT_HASH=$(git rev-parse --short HEAD)
          cat > apps/app/tauri-dev.conf.json <<EOF
          {
            "productName": "Orbiont (dev-${GIT_HASH})",
            "mainBinaryName": "Orbiont (dev-${GIT_HASH})",
            "identifier": "Orbiont-dev-${GIT_HASH}",
            "bundle": {
              "fileAssociations": []
            }
          }
          EOF

      - name: Install Linux build dependencies
        if: contains(matrix.artifact-target-name, 'linux')
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Dasel
        uses: jaxxstorm/action-install-gh-release@25e24d2d23ae098373794ef1d6faecb48ee52da8 # v3.0.0
        with:
          repo: TomWright/dasel
          tag: v2.8.1
          extension-matching: disable
          rename-to: ${{ contains(matrix.artifact-target-name, 'windows') && 'dasel.exe' || 'dasel' }}
          chmod: 0755

      - name: Set application version
        shell: bash
        run: |
          APP_VERSION="${{ inputs.app-version-override }}"
          if [ -z "$APP_VERSION" ] && [ "${{ startsWith(github.ref, 'refs/tags/v') }}" = 'true' ]; then
            APP_VERSION="${GITHUB_REF_NAME}"
          fi
          if [ -n "$APP_VERSION" ]; then
            echo "Setting application version to $APP_VERSION"
            dasel put -f apps/app/Cargo.toml -t string -v "${APP_VERSION#v}" 'package.version'
            dasel put -f packages/app-lib/Cargo.toml -t string -v "${APP_VERSION#v}" 'package.version'
            dasel put -f apps/app-frontend/package.json -t string -v "${APP_VERSION#v}" 'version'
          fi

      - name: Set app environment
        shell: bash
        env:
          MICROSOFT_CLIENT_ID: ${{ vars.MICROSOFT_CLIENT_ID }}
          DISCORD_CLIENT_ID: ${{ vars.DISCORD_CLIENT_ID }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync, writeFileSync } from 'node:fs';
          const microsoftId = (process.env.MICROSOFT_CLIENT_ID || '').trim();
          const discordId = (process.env.DISCORD_CLIENT_ID || '').trim();
          if (microsoftId && !/^[0-9a-f]{8}-(?:[0-9a-f]{4}-){3}[0-9a-f]{12}$/i.test(microsoftId)) {
            throw new Error('Repository variable MICROSOFT_CLIENT_ID must be a valid public client ID.');
          }
          if (process.env.IS_RELEASE === 'true' && !microsoftId) {
            throw new Error('Set repository variable MICROSOFT_CLIENT_ID before building a release.');
          }
          if (discordId && !/^\d+$/.test(discordId)) {
            throw new Error('Repository variable DISCORD_CLIENT_ID must be a numeric application ID.');
          }
          const content = readFileSync('packages/app-lib/.env.example', 'utf8')
            .replace(/^MICROSOFT_CLIENT_ID=.*$/m, `MICROSOFT_CLIENT_ID=${microsoftId}`)
            .replace(/^DISCORD_CLIENT_ID=.*$/m, `DISCORD_CLIENT_ID=${discordId}`);
          writeFileSync('packages/app-lib/.env', content);
          NODE

      - name: Install dependencies
        run: pnpm install

      - name: Build macOS app
        if: contains(matrix.artifact-target-name, 'darwin')
        run: |
          # Tauri distinguishes missing Apple credentials from empty values.
          for credential in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_TEAM_ID APPLE_PASSWORD; do
            if [ -z "${!credential}" ]; then
              unset "$credential"
            fi
          done
          pnpm --filter=@orbiont/app run tauri build --target universal-apple-darwin --config ${{ env.IS_RELEASE == 'true' && 'tauri-release.conf.json' || 'tauri-dev.conf.json' }}
        env:
          TAURI_BUNDLER_DMG_IGNORE_CI: 'true'
          # Optional Apple signing; unsigned builds when the secrets are missing.
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Build Linux app
        if: contains(matrix.artifact-target-name, 'linux')
        run: pnpm --filter=@orbiont/app run tauri build --config ${{ env.IS_RELEASE == 'true' && 'tauri-release.conf.json' || 'tauri-dev.conf.json' }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Build Windows app
        if: contains(matrix.artifact-target-name, 'windows')
        shell: pwsh
        run: |
          $env:JAVA_HOME = "$env:JAVA_HOME_17_X64"
          $config = if ($env:IS_RELEASE -eq 'true') { 'tauri-release.conf.json' } else { 'tauri-dev.conf.json' }
          pnpm --filter=@orbiont/app run tauri build --config $config --verbose --bundles nsis
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_KEY_PASSWORD }}

      - name: Upload app bundles
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: App bundle (${{ matrix.artifact-target-name }})
          if-no-files-found: error
          path: |
            target/release/bundle/appimage/Orbiont*.AppImage*
            target/release/bundle/deb/Orbiont*.deb*
            target/release/bundle/rpm/Orbiont*.rpm*
            target/universal-apple-darwin/release/bundle/macos/Orbiont*.app.tar.gz*
            target/universal-apple-darwin/release/bundle/dmg/Orbiont*.dmg*
            target/release/bundle/nsis/Orbiont*-setup.exe*
            target/release/bundle/nsis/Orbiont*-setup.nsis.zip*
