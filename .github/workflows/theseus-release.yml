name: Orbiont release
on:
  workflow_run:
    workflows: ['Orbiont build']
    types: [completed]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  release:
    name: Release Orbiont
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      startsWith(github.event.workflow_run.head_branch, 'v')
    runs-on: ubuntu-latest
    env:
      VERSION_TAG: ${{ github.event.workflow_run.head_branch }}
      LINUX: App bundle (x86_64-unknown-linux-gnu)
      WINDOWS: App bundle (x86_64-pc-windows-msvc)
      MACOS: App bundle (universal-apple-darwin)
      # Update bundles are staged here until the website verifies and hosts them.
      DOWNLOAD_BASE_URL: https://github.com/${{ github.repository }}/releases/download/${{ github.event.workflow_run.head_branch }}
      UPDATE_BASE_URL: https://www.xerohost.net/orbiont-updates

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Verify ref is a tag
        env:
          GH_TOKEN: ${{ github.token }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          commit_sha=$(git rev-list -n 1 "refs/tags/${VERSION_TAG}" 2>/dev/null || true)
          if [ -z "$commit_sha" ]; then
            echo "::error::${VERSION_TAG} is not a git tag in this repo"
            exit 1
          fi
          if [ "$commit_sha" != "$HEAD_SHA" ]; then
            echo "::error::Tag ${VERSION_TAG} (${commit_sha}) does not match build head_sha (${HEAD_SHA})"
            exit 1
          fi
          echo "Verified ${VERSION_TAG} is a tag pointing at ${HEAD_SHA}"

      - name: Download Orbiont artifacts
        uses: dawidd6/action-download-artifact@b6e2e70617bc3265edd6dab6c906732b2f1ae151 # v21
        with:
          workflow: theseus-build.yml
          run_id: ${{ github.event.workflow_run.id }}
          use_unzip: true

      - name: Collect release files
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          mkdir -p dist

          # Exactly one file must match each pattern.
          pick() {
            local matches=()
            mapfile -t matches < <(compgen -G "$1" || true)
            if [ "${#matches[@]}" -ne 1 ]; then
              echo "::error::Expected one file for '$1', found ${#matches[@]}"
              exit 1
            fi
            cp "${matches[0]}" dist/
            basename "${matches[0]}"
          }

          echo "WINDOWS_SETUP=$(pick "${WINDOWS}/release/bundle/nsis/Orbiont_*_x64-setup.exe")" >> "$GITHUB_ENV"
          echo "WINDOWS_UPDATE=$(pick "${WINDOWS}/release/bundle/nsis/Orbiont_*_x64-setup.nsis.zip")" >> "$GITHUB_ENV"
          pick "${WINDOWS}/release/bundle/nsis/Orbiont_*_x64-setup.nsis.zip.sig" > /dev/null
          echo "MACOS_DMG=$(pick "${MACOS}/universal-apple-darwin/release/bundle/dmg/Orbiont_*.dmg")" >> "$GITHUB_ENV"
          echo "MACOS_UPDATE=$(pick "${MACOS}/universal-apple-darwin/release/bundle/macos/Orbiont.app.tar.gz")" >> "$GITHUB_ENV"
          pick "${MACOS}/universal-apple-darwin/release/bundle/macos/Orbiont.app.tar.gz.sig" > /dev/null
          echo "LINUX_APPIMAGE=$(pick "${LINUX}/release/bundle/appimage/Orbiont_*.AppImage")" >> "$GITHUB_ENV"
          echo "LINUX_UPDATE=$(pick "${LINUX}/release/bundle/appimage/Orbiont_*.AppImage.tar.gz")" >> "$GITHUB_ENV"
          pick "${LINUX}/release/bundle/appimage/Orbiont_*.AppImage.tar.gz.sig" > /dev/null
          echo "LINUX_DEB=$(pick "${LINUX}/release/bundle/deb/Orbiont_*.deb")" >> "$GITHUB_ENV"
          echo "LINUX_RPM=$(pick "${LINUX}/release/bundle/rpm/Orbiont-*.rpm")" >> "$GITHUB_ENV"
          ls -la dist

      - name: Write release notes
        run: |
          # Publish the English release document, preserving Markdown headings.
          # Git's default tag cleanup can remove headings from annotations.
          notes_path="docs/releases/${VERSION_TAG#v}.md"
          if [ -s "$notes_path" ]; then
            cat "$notes_path" > release-notes.md
          else
            echo "Orbiont ${VERSION_TAG#v}" > release-notes.md
          fi
          printf '\n## Source code and license\n\n' >> release-notes.md
          printf 'Orbiont is licensed under GPL-3.0-only, without warranty. Individual packages retain their respective licenses.\n\n' >> release-notes.md
          printf -- '- [Source for this version](https://github.com/%s/tree/%s)\n' "$GITHUB_REPOSITORY" "$VERSION_TAG" >> release-notes.md
          printf -- '- [Download source code](https://github.com/%s/archive/refs/tags/%s.tar.gz)\n' "$GITHUB_REPOSITORY" "$VERSION_TAG" >> release-notes.md
          printf -- '- [GPL-3.0 license](https://github.com/%s/blob/%s/apps/app/LICENSE)\n' "$GITHUB_REPOSITORY" "$VERSION_TAG" >> release-notes.md
          printf -- '- [Credits and build instructions](https://github.com/%s/blob/%s/README.md)\n' "$GITHUB_REPOSITORY" "$VERSION_TAG" >> release-notes.md
          cat release-notes.md

      - name: Generate update manifest
        run: |
          # Reference: https://tauri.app/plugin/updater/#server-support
          jq -nc \
            --arg version "${VERSION_TAG#v}" \
            --arg base "${DOWNLOAD_BASE_URL}" \
            --arg macUpdate "${MACOS_UPDATE}" --arg macDmg "${MACOS_DMG}" \
            --arg linuxUpdate "${LINUX_UPDATE}" --arg linuxAppImage "${LINUX_APPIMAGE}" \
            --arg linuxDeb "${LINUX_DEB}" --arg linuxRpm "${LINUX_RPM}" \
            --arg winUpdate "${WINDOWS_UPDATE}" --arg winSetup "${WINDOWS_SETUP}" \
            --rawfile notes release-notes.md \
            --rawfile macSig "dist/${MACOS_UPDATE}.sig" \
            --rawfile linuxSig "dist/${LINUX_UPDATE}.sig" \
            --rawfile winSig "dist/${WINDOWS_UPDATE}.sig" \
          '{
            "version": $version,
            "notes": $notes,
            "pub_date": now | todateiso8601,
            "platforms": {
              "darwin-aarch64": {
                "signature": $macSig,
                "url": "\($base)/\($macUpdate)",
                "install_urls": ["\($base)/\($macDmg)"]
              },
              "darwin-x86_64": {
                "signature": $macSig,
                "url": "\($base)/\($macUpdate)",
                "install_urls": ["\($base)/\($macDmg)"]
              },
              "linux-x86_64": {
                "signature": $linuxSig,
                "url": "\($base)/\($linuxUpdate)",
                "install_urls": ["\($base)/\($linuxDeb)", "\($base)/\($linuxAppImage)", "\($base)/\($linuxRpm)"]
              },
              "windows-x86_64": {
                "signature": $winSig,
                "url": "\($base)/\($winUpdate)",
                "install_urls": ["\($base)/\($winSetup)"]
              }
            }
          }' > dist/updates.json

          cat dist/updates.json

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Keep the legacy manifest endpoint working for beta.1 installations.
          # Detached signatures are already embedded in updates.json.
          gh release create "$VERSION_TAG" \
            --title "Orbiont ${VERSION_TAG#v}" \
            --notes-file release-notes.md \
            --latest \
            "dist/${WINDOWS_SETUP}" "dist/${MACOS_DMG}" \
            "dist/${LINUX_APPIMAGE}" "dist/${LINUX_DEB}" "dist/${LINUX_RPM}" \
            "dist/${WINDOWS_UPDATE}" "dist/${MACOS_UPDATE}" "dist/${LINUX_UPDATE}" \
            dist/updates.json

      - name: Move update bundles off the public download list
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # The landing repository polls new releases every 15 minutes and
          # verifies their signatures before publishing the update feed.
          ready=false
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 30 "${UPDATE_BASE_URL}/updates.json" -o hosted-updates.json &&
              jq -e --arg version "${VERSION_TAG#v}" \
                --arg base "${UPDATE_BASE_URL}/${VERSION_TAG}" \
                --arg win "$WINDOWS_UPDATE" --arg mac "$MACOS_UPDATE" --arg linux "$LINUX_UPDATE" \
                --slurpfile original dist/updates.json '
                  .version == $version and
                  .platforms["windows-x86_64"].url == ($base + "/" + $win) and
                  .platforms["linux-x86_64"].url == ($base + "/" + $linux) and
                  .platforms["darwin-aarch64"].url == ($base + "/" + $mac) and
                  .platforms["darwin-x86_64"].url == ($base + "/" + $mac) and
                  ([.platforms | to_entries[] | {key, signature: .value.signature}] | sort_by(.key)) ==
                    ([$original[0].platforms | to_entries[] | {key, signature: .value.signature}] | sort_by(.key))
                ' hosted-updates.json > /dev/null; then
              ready=true
              for bundle in "$WINDOWS_UPDATE" "$MACOS_UPDATE" "$LINUX_UPDATE"; do
                curl -fsSI --max-time 30 "${UPDATE_BASE_URL}/${VERSION_TAG}/${bundle}" > /dev/null || ready=false
              done
              if [ "$ready" = true ]; then break; fi
            fi
            sleep 30
          done
          if [ "$ready" != true ]; then
            echo "::error::Update hosting is not ready; bundles retained to preserve automatic updates"
            exit 1
          fi
          cp hosted-updates.json dist/updates.json
          gh release upload "$VERSION_TAG" dist/updates.json --clobber
          for bundle in "$WINDOWS_UPDATE" "$MACOS_UPDATE" "$LINUX_UPDATE"; do
            gh release delete-asset "$VERSION_TAG" "$bundle" --yes
          done
