name: CI

on:
  workflow_call:
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  glib-backport:
    name: GLib optimized regression
    uses: ./.github/workflows/glib-backport.yml
  native-platform-fixtures:
    name: Native fixtures (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        platform: [ubuntu-22.04, macos-latest]
    runs-on: ${{ matrix.platform }}
    env:
      SQLX_OFFLINE: true
      CARGO_INCREMENTAL: '0'
      RUST_MIN_STACK: 134217728
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install Linux native dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libcurl4-openssl-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev
      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          rustflags: ''
          cache: false
      - name: Setup compiler cache
        uses: mozilla-actions/sccache-action@d651010b8da762cde178750d8eda7b5febfe147a # v0.0.9
        with:
          version: v0.10.0
      # PR compiler-cache writes use their own namespace in addition to GHA merge-ref scope.
      # Trusted main/dispatch/tag runs never read a PR namespace.
      - name: Configure compiler cache scope
        shell: bash
        run: |
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=on" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_VERSION=orbiont-v1-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'trusted' }}-${{ runner.os }}-${{ runner.arch }}-native-checks-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}" >> "$GITHUB_ENV"
      - name: Setup Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 17
      - name: Set fixture environment
        run: cp packages/app-lib/.env.example packages/app-lib/.env
      - name: Run isolated native fixtures
        run: cargo test --locked -p theseus --lib -- --test-threads=1
  windows-bedrock:
    name: Windows Bedrock regression tests
    runs-on: windows-latest
    env:
      SQLX_OFFLINE: true
      RUST_MIN_STACK: 134217728
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          rustflags: ''
          cache: false
      - name: Setup compiler cache
        uses: mozilla-actions/sccache-action@d651010b8da762cde178750d8eda7b5febfe147a # v0.0.9
        with:
          version: v0.10.0
      # PR compiler-cache writes use their own namespace in addition to GHA merge-ref scope.
      # Trusted main/dispatch/tag runs never read a PR namespace.
      - name: Configure compiler cache scope
        shell: bash
        run: |
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=on" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_VERSION=orbiont-v1-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'trusted' }}-${{ runner.os }}-${{ runner.arch }}-native-checks-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}" >> "$GITHUB_ENV"
      - name: Setup Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 17
      - name: Set app environment
        shell: pwsh
        run: Copy-Item -LiteralPath packages/app-lib/.env.example -Destination packages/app-lib/.env
      - name: Run Bedrock fixture tests on Windows
        run: cargo test -p theseus --lib api::bedrock -- --test-threads=1
      - name: Check measurement process selection
        shell: pwsh
        run: ./scripts/launcher-process-tree.test.ps1
  dependency-security:
    name: Dependency advisories
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Enable Corepack
        run: corepack enable
      - name: Locate pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Restore pnpm store
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Save trusted pnpm store
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Audit application dependencies
        run: pnpm audit --prod --audit-level=moderate
      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          rustflags: ''
          cache: false
      - name: Install cargo-audit
        uses: taiki-e/install-action@b6ff580856c41316412a0b9b60540fbc6f8c82cc # v2.86.7
        with:
          tool: cargo-audit@0.22.2
      - name: Audit Cargo.lock
        run: node scripts/check-cargo-advisories.mjs
  build:
    name: Lint and Test
    runs-on: ubuntu-latest

    env:
      # Ensure pnpm output is colored in GitHub Actions logs
      FORCE_COLOR: 3
      # Make cargo nextest successfully ignore projects without tests
      NEXTEST_NO_TESTS: pass
      # Package lint scripts deny warnings on their primary Clippy targets.
      # Global RUSTFLAGS would also reject warnings in the reviewed GLib vendor.
      SQLX_OFFLINE: true
      # Avoid stack overflows in tests
      RUST_MIN_STACK: 134217728

    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - name: Enable Corepack
        run: corepack enable

      - name: Install apt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake libcurl4-openssl-dev libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Setup Rust toolchain
        uses: actions-rust-lang/setup-rust-toolchain@166cdcfd11aee3cb47222f9ddb555ce30ddb9659 # v1.17.0
        with:
          rustflags: ''
          cache: false
          components: clippy, rustfmt

      - name: Setup compiler cache
        uses: mozilla-actions/sccache-action@d651010b8da762cde178750d8eda7b5febfe147a # v0.0.9
        with:
          version: v0.10.0
      # PR compiler-cache writes use their own namespace in addition to GHA merge-ref scope.
      # Trusted main/dispatch/tag runs never read a PR namespace.
      - name: Configure compiler cache scope
        shell: bash
        run: |
          echo "RUSTC_WRAPPER=sccache" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_ENABLED=on" >> "$GITHUB_ENV"
          echo "SCCACHE_GHA_VERSION=orbiont-v1-${{ github.event_name == 'pull_request' && format('pr-{0}', github.event.pull_request.number) || 'trusted' }}-${{ runner.os }}-${{ runner.arch }}-native-checks-${{ hashFiles('rust-toolchain.toml', 'Cargo.lock', 'Cargo.toml') }}" >> "$GITHUB_ENV"
      - name: Setup Java
        uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: 17

      - name: Setup binstall
        uses: cargo-bins/cargo-binstall@ead08b90bd7b2e6d81963fb9cf0b7239f66d5db4 # v1.21.0

      - name: Setup nextest
        run: |
          # Cached Cargo install metadata can outlive the corresponding binary.
          cargo binstall --no-confirm --secure --locked --force cargo-nextest@0.9.133
          cargo nextest --version

      - name: Locate pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Restore pnpm store
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-v1-${{ runner.os }}-${{ runner.arch }}-
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Save trusted pnpm store
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Set app environment
        working-directory: packages/app-lib
        run: cp .env.example .env

      - name: Serial native checks
        run: pnpm ci:native

      - name: CI configuration contract
        run: pnpm test:ci

      - name: Deny warnings in remaining workspace crates
        # These crates have no package.json lint task. Select each as a primary
        # target so --no-deps excludes the unchanged third-party GLib source.
        run: cargo clippy --locked -p content-management -p path-util -p serde-binhum -p async-minecraft-ping --all-targets -- --no-deps -Dwarnings

      - name: Build and check frontend size budget
        run: |
          node --test scripts/frontend-budget.test.mjs
          pnpm --filter @orbiont/app-frontend build
          node scripts/frontend-budget.mjs --check

      - name: Verify intl:extract has been run
        run: |
          pnpm turbo run intl:extract --force
          git diff --exit-code --color */*/src/locales/*/index.json

  javascript:
    name: JavaScript checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version-file: .nvmrc
      - run: corepack enable
      - name: Locate pnpm store
        id: pnpm-store
        shell: bash
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"
      - name: Restore pnpm store
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-v1-${{ runner.os }}-${{ runner.arch }}-
      - run: pnpm install --frozen-lockfile
      - name: Save trusted pnpm store
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809 # v4.2.4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml') }}
      - name: Restore frontend task results
        uses: actions/cache/restore@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: .turbo/cache
          key: turbo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'rust-toolchain.toml') }}-${{ github.sha }}
          restore-keys: turbo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'rust-toolchain.toml') }}-
      - run: pnpm ci:js
      - name: Save trusted frontend task results
        if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch')
        uses: actions/cache/save@0400d5f644dc74513175e3cd8d07132dd4860809
        with:
          path: .turbo/cache
          key: turbo-v1-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('pnpm-lock.yaml', 'rust-toolchain.toml') }}-${{ github.sha }}
