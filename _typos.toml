[files]
extend-exclude = [
  "**/src/locales/",
  "apps/frontend/",
  "patches/",
  "packages/utils/",
  "packages/ui/",
  "packages/blog/",
  # contains payment card IDs like `IY1VMST1MOXS` which are flagged
  "apps/labrinth/src/queue/payouts/mod.rs",
  "apps/app-frontend/src/components/ui/settings/instances/game-settings-modal/languages.ts"
]

[default]
extend-ignore-re = [
  # Ignore lines that end with `// typos:ignore`
  "(?Rm)^.*(#|//)\\s*typos:ignore$",
  # Ignore the line after `// typos:ignore`:
  "(#|//)\\s*typos:ignore\\n.*",
  # Ignore blocks between `// typos:off` and `// typos:on`
  "(?s)(#|//)\\s*typos:off.*?\\n\\s*(#|//)\\s*typos:on",
  # Spanish messages intentionally retained in the local translation CLI.
  "El JSON debe ser un objeto",
  "requiere un número",
  "debe ser un entero >= 0",
  "--scope debe ser app o ui",
  "--hint requiere uno o varios códigos de idioma",
  "Ruta del JSON \\(alternativa al argumento posicional\\)",
]

[default.extend-words]
# Terms Of Use in `tou-link`
tou = "tou"
# Google Ad Manager
gam = "gam"
# short for "constants"
consts = "consts"
# short for "Copy"
Cpy = "Cpy"

[default.extend-identifiers]
# Constant from the `zip` crate
ZIP64_BYTES_THR = "ZIP64_BYTES_THR"
